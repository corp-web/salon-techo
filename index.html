<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="サロン手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>サロン手帳</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#3a332d;--sub:#8a7f74;--line:#e8dfd4;--accent:#8c5a3c;--soft:#f3e7db;--ok:#4f7a5a;--warn:#b5523b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:var(--card)}
header h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.06em}
header .today{color:var(--sub);font-size:15px}
nav{display:flex;gap:6px;padding:8px 12px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 4px;border:none;background:none;border-radius:12px;font-size:16px;color:var(--sub);cursor:pointer;font-family:inherit}
nav button.on{background:var(--accent);color:#fff;font-weight:600}
main{max-width:960px;margin:0 auto;padding:18px 20px calc(80px + env(safe-area-inset-bottom))}
nav{max-width:none}nav button{font-size:17px;padding:14px 4px}
main>section{display:none}main>section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;color:var(--sub);font-weight:600;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center}
.btn{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;color:var(--ink);font-family:inherit;white-space:nowrap}
.btn.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.sm{padding:8px 14px;font-size:15px}
.btn.danger{color:var(--warn);border-color:#ecc9bf}
input,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fffdfa;width:100%;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar .d{flex:1;text-align:center;font-size:20px;font-weight:600}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .time{font-size:20px;font-weight:600;width:62px;color:var(--accent)}
.item .body{flex:1;min-width:0}
.item .name{font-size:18px;font-weight:600}
.sub{color:var(--sub);font-size:14px;margin-top:2px}
.item.done{opacity:.55}
.tag{font-size:14px;color:var(--ok);background:#e8f0ea;padding:6px 10px;border-radius:999px;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:24px 0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mbtn{padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center}
.mbtn b{font-size:17px}.mbtn span{font-size:14px;color:var(--sub)}
.mbtn:active{transform:scale(.97)}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.x{border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;margin-left:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.total b{font-size:34px;color:var(--accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;font-family:inherit;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px;line-height:1.6}
.hint:empty{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .k{font-size:14px;color:var(--sub)}.stat .v{font-size:28px;font-weight:600;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
dialog{border:none;border-radius:20px;padding:22px;width:min(560px,94vw);max-height:90vh;color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(40,30,20,.35)}
dialog h3{margin:0 0 4px;font-size:20px}
.dlgbtns{display:flex;gap:10px;margin-top:20px}
.dlgbtns .btn{flex:1}
.hist{margin-top:8px}
.hist .h{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:16px}
#toast.on{opacity:1;transform:translateX(-50%)}
.mrow{display:flex;gap:8px;margin-bottom:8px}.mrow input:first-child{flex:2}.mrow input:nth-child(2){flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:13px;color:var(--sub);padding:4px 0}
.cal .day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:104px;padding:6px;cursor:pointer;overflow:hidden;min-width:0}
.cal .day:active{background:var(--soft)}
.cal .day.out{opacity:.35}
.cal .day.today{border:2px solid var(--accent)}
.cal .n{font-size:14px;font-weight:600}
.cal .sun .n,.cal .wd:first-child{color:var(--warn)}.cal .sat .n,.cal .wd:last-child{color:#4a6a9a}
.cal .ev{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.done{opacity:.5}
.cal .more{font-size:11px;color:var(--sub);margin-top:2px}
.cal .cnt{display:none}
@media(max-width:520px){nav{gap:2px;padding:6px 6px 8px}nav button{font-size:12.5px!important;padding:12px 0!important;letter-spacing:-.02em}
  .cal .day{min-height:58px;padding:4px;text-align:center}.cal .ev,.cal .more{display:none}
  .cal .cnt{display:block;margin:4px auto 0;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}}
@media(max-width:520px){nav button{font-size:14px}.item .time{width:52px;font-size:17px}.total b{font-size:28px}}
</style>
</head>
<body>
<header><h1 id="shopName">サロン手帳</h1><span class="today" id="hdrDate"></span></header>
<nav>
  <button data-t="yoyaku" class="on">予約</button>
  <button data-t="calendar">カレンダー</button>
  <button data-t="kaikei">会計</button>
  <button data-t="okyaku">お客様</button>
  <button data-t="uriage">売上</button>
  <button data-t="settei">設定</button>
</nav>
<datalist id="names"></datalist>

<main>
<!-- 予約 -->
<section id="yoyaku" class="on">
  <div class="datebar">
    <button class="btn" id="yPrev">◀</button><div class="d" id="yDate"></div><button class="btn" id="yNext">▶</button>
    <button class="btn sm" id="yToday">今日</button>
  </div>
  <button class="btn main big" id="yAdd">＋ 予約を入れる</button>
  <div class="card" style="margin-top:14px"><div id="yList"></div></div>
</section>

<!-- カレンダー -->
<section id="calendar">
  <div class="datebar">
    <button class="btn" id="mPrev">◀</button><div class="d" id="mLbl"></div><button class="btn" id="mNext">▶</button>
    <button class="btn sm" id="mToday">今月</button>
  </div>
  <div class="cal" id="cal"></div>
  <p class="sub" style="text-align:center;margin-top:12px">日にちを押すと、その日の予約が開きます</p>
</section>

<!-- 会計 -->
<section id="kaikei">
  <div class="card">
    <div class="row"><div style="flex:2"><label style="margin-top:0">お名前</label><input id="kName" list="names" placeholder="例：山田 花子"></div>
    <div style="flex:1"><label style="margin-top:0">日付</label><input id="kDate" type="date"></div></div>
    <div class="hint" id="kHint"></div>
  </div>
  <div class="card">
    <h2>メニュー（押すと追加）</h2>
    <div class="mgrid" id="kMenus"></div>
    <div class="row" style="margin-top:12px"><input id="kOName" placeholder="その他（商品など）" style="flex:2"><input id="kOPrice" type="number" inputmode="numeric" placeholder="金額" style="flex:1"><button class="btn" id="kOAdd">追加</button></div>
  </div>
  <div class="card">
    <div id="kItems"></div>
    <div class="row" style="margin-top:12px"><span style="flex:1;color:var(--sub)">値引き</span><input id="kDisc" type="number" inputmode="numeric" placeholder="0" style="width:140px"></div>
    <div class="total"><span>合計（税込）</span><b id="kTotal">¥0</b></div>
    <label>お支払い</label>
    <div class="seg" id="kPay"><button data-p="現金">現金</button><button data-p="カード">カード</button><button data-p="QR">QR決済</button></div>
    <div class="row" id="recvRow" style="margin-top:12px"><span style="flex:1;color:var(--sub)">お預かり</span><input id="kRecv" type="number" inputmode="numeric" style="width:140px"><span style="width:110px;text-align:right">おつり <b id="kChange">—</b></span></div>
    <label>カルテメモ（今日の施術・薬剤・会話など）</label>
    <textarea id="kMemo" placeholder="例：6トーンのアッシュ。前髪短め希望。来月旅行"></textarea>
    <div class="row" style="margin-top:16px"><button class="btn" id="kClear">やり直す</button><button class="btn main big" id="kDone" style="flex:1">会計する</button></div>
  </div>
</section>

<!-- お客様 -->
<section id="okyaku">
  <div class="row" style="margin-bottom:14px"><input id="cSearch" placeholder="名前・電話番号でさがす"><button class="btn main" id="cAdd">＋ 新規</button></div>
  <div class="card"><div id="cList"></div></div>
</section>

<!-- 売上 -->
<section id="uriage">
  <div class="datebar">
    <button class="btn" id="uPrev">◀</button><div class="d" id="uDate"></div><button class="btn" id="uNext">▶</button>
    <button class="btn sm" id="uToday">今日</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">この日の売上</div><div class="v" id="uDay">¥0</div><div class="sub" id="uDaySub"></div></div>
    <div class="stat"><div class="k" id="uMonLbl">今月の売上</div><div class="v" id="uMon">¥0</div><div class="sub" id="uMonSub"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>この日の会計</h2><div id="uList"></div></div>
  <div class="card"><h2 id="uDailyLbl">日別</h2><table id="uDaily"></table></div>
</section>

<!-- 設定 -->
<section id="settei">
  <div class="card"><h2>iPadとiPhoneをつなぐ（自動同期）</h2><div id="syncBody"></div></div>
  <div class="card"><h2>お店の名前</h2><input id="sShop" placeholder="サロン手帳"></div>
  <div class="card"><h2>メニューと料金（税込）</h2><div id="sMenus"></div><button class="btn" id="sAddMenu">＋ メニューを追加</button></div>
  <div class="card"><h2>バックアップ</h2>
    <p class="sub" style="margin:0 0 12px">データはこのiPadの中だけに保存されています（外部には送られません）。月に1回ほど「データを保存」→「"ファイル"に保存」→「このiPad内」に控えを残しておくと、アプリのデータが消えても元に戻せます。</p>
    <div class="row"><button class="btn main" id="sExport">データを保存</button><button class="btn" id="sImport">保存データを読み込む</button><input type="file" id="sFile" accept=".json" hidden></div>
    <p class="sub" id="sLast"></p>
  </div>
</section>
</main>

<!-- 予約ダイアログ -->
<dialog id="dlgRes">
  <h3 id="rTitle">予約</h3>
  <div class="row"><div style="flex:1"><label>日付</label><input id="rDate" type="date"></div><div style="flex:1"><label>時間</label><input id="rTime" type="time" step="900"></div></div>
  <label>お名前</label><input id="rName" list="names" placeholder="例：山田 花子">
  <label>メニュー</label><div class="chips" id="rMenus"></div>
  <label>メモ</label><input id="rNote" placeholder="例：電話予約、指名あり">
  <div class="dlgbtns"><button class="btn danger" id="rDel">取り消す</button><button class="btn" id="rCancel">閉じる</button><button class="btn main" id="rSave">保存</button></div>
</dialog>

<!-- お客様ダイアログ -->
<dialog id="dlgCust">
  <h3>カルテ</h3>
  <label>お名前</label><input id="cName">
  <div class="row"><div style="flex:1"><label>電話</label><input id="cTel" type="tel"></div><div style="flex:1"><label>誕生日</label><input id="cBirth" type="date"></div></div>
  <label>メモ（髪質・好み・アレルギーなど）</label><textarea id="cMemo"></textarea>
  <label>来店履歴</label><div class="hist" id="cHist"></div>
  <div class="dlgbtns"><button class="btn danger" id="cDel">削除</button><button class="btn" id="cClose">閉じる</button><button class="btn main" id="cSave">保存</button></div>
  <div class="dlgbtns" style="margin-top:10px"><button class="btn" id="cToRes">この方の予約</button><button class="btn" id="cToPay">この方の会計</button></div>
</dialog>

<div id="toast"></div>

<script>
const KEY='salon-techo-v1';
const DEFAULT_MENUS=[{name:'カット',price:4400},{name:'カラー',price:6600},{name:'パーマ',price:8800},{name:'トリートメント',price:3300},{name:'ヘッドスパ',price:3300},{name:'シャンプーブロー',price:2200}];
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+(n||0).toLocaleString();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const hm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDay=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const W='日月火水木金土';
const jp=s=>{const d=new Date(s+'T00:00');return `${d.getMonth()+1}月${d.getDate()}日(${W[d.getDay()]})`};
const sumOf=a=>a.reduce((x,s)=>x+s.total,0);

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.menus)return d}catch(e){}
  return{shop:'',menus:DEFAULT_MENUS.map(m=>({...m})),customers:[],reservations:[],sales:[],lastBackup:''}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存できませんでした。バックアップを取ってください。')}}
function save(){if(S.syncUid&&!FB.ready)S.offEdits=true;saveLocal();schedulePush()} // 同期が切れている間の入力は、再ログイン時に消さずに合流させる
let S=load();

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
function custByName(n){return S.customers.find(c=>c.name===n)}
function ensureCust(n){n=(n||'').trim();if(!n)return null;let c=custByName(n);if(!c){c={id:uid(),name:n,tel:'',birth:'',memo:''};S.customers.push(c)}return c}
function fillNames(){$('#names').innerHTML=S.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}
function header(){$('#shopName').textContent=S.shop||'サロン手帳';const h=$('#hdrDate');
  const cut=FB.authChecked&&!FB.user&&S.syncUid; // 以前つないでいたのに、今はログインが切れている
  h.innerHTML=esc(jp(today()))+(FB.user?'　<span style="color:var(--ok)">● 同期中</span>':cut?'　<span style="color:var(--warn);cursor:pointer" onclick="show(\'settei\')">⚠ 同期が切れています（押して再ログイン）</span>':'')}

/* ---- タブ ---- */
const render={yoyaku:renderYoyaku,calendar:renderCal,kaikei:renderKaikei,okyaku:renderOkyaku,uriage:renderUriage,settei:renderSettei};
function show(t){$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('main>section').forEach(s=>s.classList.toggle('on',s.id===t));render[t]();window.scrollTo(0,0)}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));

/* ---- 予約 ---- */
let resDate=today(),editRes=null,resMenus=[];
function renderYoyaku(){
  $('#yDate').textContent=jp(resDate)+(resDate===today()?'・今日':'');
  const list=S.reservations.filter(r=>r.date===resDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  $('#yList').innerHTML=list.length?list.map(r=>{
    const done=r.status==='done',sale=done&&S.sales.find(s=>s.id===r.saleId);
    return `<div class="item ${done?'done':''}" data-id="${r.id}">
      <div class="time">${r.time||'--:--'}</div>
      <div class="body"><div class="name">${esc(r.name)} 様</div><div class="sub">${esc((r.menus||[]).join('・'))}${r.note?'　'+esc(r.note):''}</div></div>
      ${done?`<span class="tag">会計済 ${sale?yen(sale.total):''}</span>`:`<button class="btn main sm" data-pay="${r.id}">会計</button>`}
    </div>`}).join(''):'<p class="empty">予約はありません</p>';
}
$('#yList').onclick=e=>{
  const p=e.target.closest('[data-pay]');
  if(p){startCheckout(S.reservations.find(r=>r.id===p.dataset.pay));return}
  const it=e.target.closest('.item');if(it)openRes(it.dataset.id);
};
$('#yPrev').onclick=()=>{resDate=addDay(resDate,-1);renderYoyaku()};
$('#yNext').onclick=()=>{resDate=addDay(resDate,1);renderYoyaku()};
$('#yToday').onclick=()=>{resDate=today();renderYoyaku()};
$('#yAdd').onclick=()=>openRes(null);

function chips(sel,arr){const el=$(sel);
  el.innerHTML=S.menus.map(m=>`<button type="button" class="chip ${arr.includes(m.name)?'on':''}" data-n="${esc(m.name)}">${esc(m.name)}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=arr.indexOf(b.dataset.n);i<0?arr.push(b.dataset.n):arr.splice(i,1);b.classList.toggle('on')}}
function openRes(id,presetName){
  editRes=id?S.reservations.find(r=>r.id===id):null;
  const r=editRes||{date:resDate,time:'10:00',name:presetName||'',menus:[],note:''};
  $('#rTitle').textContent=editRes?'予約の変更':'予約を入れる';
  $('#rDate').value=r.date;$('#rTime').value=r.time;$('#rName').value=r.name;$('#rNote').value=r.note||'';
  resMenus=[...(r.menus||[])];chips('#rMenus',resMenus);
  $('#rDel').style.display=editRes&&editRes.status!=='done'?'':'none';
  fillNames();$('#dlgRes').showModal();
}
$('#rCancel').onclick=()=>$('#dlgRes').close();
$('#rSave').onclick=()=>{
  const name=$('#rName').value.trim();if(!name){alert('お名前を入れてください');return}
  const c=ensureCust(name);
  const d={date:$('#rDate').value||resDate,time:$('#rTime').value,name,customerId:c.id,menus:[...resMenus],note:$('#rNote').value.trim()};
  if(editRes)Object.assign(editRes,d);else S.reservations.push({id:uid(),status:'yoyaku',...d});
  save();resDate=d.date;$('#dlgRes').close();show('yoyaku');toast(editRes?'予約を変更しました':'予約を入れました');
};
$('#rDel').onclick=()=>{if(!editRes||!confirm(`${editRes.name} 様の予約を取り消しますか？`))return;

const FIREBASE_CONFIG={apiKey:'AIzaSyDGyfdjRb055c3ICmpPLSBL8OpCG2h4UjQ',authDomain:'salon-techo.firebaseapp.com',projectId:'salon-techo',storageBucket:'salon-techo.firebasestorage.app',messagingSenderId:'623463517972',appId:'1:623463517972:web:5e6b3b8712b67c9e17bc01'};

const COLS=['customers','reservations','sales'];
const FB={user:null,ready:false,shadow:{},first:{},merge:false};
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
function localDocs(){const m={};COLS.forEach(c=>S[c].forEach(x=>m[c+'/'+x.id]=x));m['meta/settings']={id:'settings',shop:S.shop||'',menus:S.menus};return m}
function schedulePush(){if(!FB.ready)return;clearTimeout(FB.t);FB.t=setTimeout(push,400)}
async function push(){
  if(!FB.ready)return;const {doc,writeBatch}=FB.fs,cur=localDocs(),ops=[];
  for(const k in cur){const s=canon(cur[k]);if(FB.shadow[k]!==s){ops.push(['set',k,JSON.parse(JSON.stringify(cur[k]))]);FB.shadow[k]=s}}
  for(const k in FB.shadow)if(!(k in cur)){ops.push(['del',k]);delete FB.shadow[k]}
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(FB.db);
    ops.slice(i,i+400).forEach(([t,k,d])=>{const r=doc(FB.db,'users',FB.user.uid,...k.split('/'));t==='set'?b.set(r,d):b.delete(r)});
    try{await b.commit()}catch(e){console.error(e);toast('同期できませんでした（あとで自動で再開します）')}}
}
function applyRemote(c,snap){
  if(snap.metadata.fromCache&&snap.empty)return; // 端末の控えが空のときは上書きしない
  if(c==='meta'){const d=snap.docs.find(x=>x.id==='settings');
    if(d){const v=d.data();S.shop=v.shop||'';S.menus=v.menus||[];FB.shadow['meta/settings']=canon({id:'settings',shop:S.shop,menus:S.menus})}}
  else{
    const byId=new Map(S[c].map(x=>[x.id,x])),next=[],seen=new Set();
    snap.docs.forEach(d=>{const v=d.data();let o=byId.get(d.id);
      if(o){Object.keys(o).forEach(k=>{if(!(k in v))delete o[k]});Object.assign(o,v)}else o=v;
      o.id=d.id;next.push(o);seen.add(d.id);FB.shadow[c+'/'+d.id]=canon(o)});
    Object.keys(FB.shadow).forEach(k=>{if(k.startsWith(c+'/')&&!seen.has(k.slice(c.length+1)))delete FB.shadow[k]});
    if(FB.merge&&!FB.ready)S[c].forEach(x=>{if(!seen.has(x.id))next.push(x)}); // 初回だけ：端末にしかない記録も残す
    S[c]=next;
  }
  FB.first[c]=true;
  if(!FB.ready&&[...COLS,'meta'].every(k=>FB.first[k])){FB.ready=true;const was=S.syncUid;S.syncUid=FB.user.uid;delete S.offEdits;saveLocal();push();if(FB.merge)toast(was?'同期を再開しました':'この端末のデータをクラウドに移しました')}
  saveLocal();header();
  const a=document.activeElement;if(!(a&&a.matches('main input,main textarea')))render[$('nav button.on').dataset.t]();
}

  FB.unsub=[...COLS,'meta'].map(c=>onSnapshot(collection(FB.db,'users',user.uid,c),{includeMetadataChanges:true},s=>applyRemote(c,s),e=>console.error(e)));
}

  const go=async(fn,ok)=>{const m=$('#syncMail').value.trim(),p=$('#syncPass').value;if(!m||!p){alert('メールアドレスとパスワードを入れてください');return}
    try{await fn(FB.authObj,m,p);toast(ok)}
    catch(e){const c=e.code||'';alert(/email-already-in-use/.test(c)?'このメールは登録済みです。「ログイン」を押してください':/weak-password/.test(c)?'パスワードは6文字以上にしてください':/invalid-email/.test(c)?'メールアドレスの形が正しくありません':/invalid|wrong|not-found|credential/.test(c)?'メールアドレスかパスワードが違います':/network/.test(c)?'ネットにつながっていません':'うまくいきませんでした（'+c+'）')}};
  $('#syncIn').onclick=()=>go(FB.auth.signInWithEmailAndPassword,'ログインしました');
  $('#syncNew').onclick=()=>go(FB.auth.createUserWithEmailAndPassword,'登録しました。同期を始めます');
}
async function initSync(){
  if(!FIREBASE_CONFIG)return;
  try{
    const [{initializeApp},fs,auth]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js'),import(SDK+'firebase-auth.js')]);
    const app=initializeApp(FIREBASE_CONFIG);
    FB.fs=fs;FB.auth=auth;
    FB.db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentSingleTabManager()})});
    FB.authObj=auth.initializeAuth(app,{persistence:[auth.indexedDBLocalPersistence,auth.browserLocalPersistence]});
    auth.onAuthStateChanged(FB.authObj,u=>{FB.authChecked=true;if(u&&(!FB.user||FB.user.uid!==u.uid))startSync(u);else if(!u&&FB.user)stopSync();header();renderSync()});
  }catch(e){console.error(e)}
}

header();renderYoyaku();initSync();
// iPad：データを消されにくくする＋オフライン対応
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
// 30日以上バックアップしていなければお知らせ
if(S.sales.length&&(!S.lastBackup||(new Date(today())-new Date(S.lastBackup))/864e5>30))setTimeout(()=>toast('そろそろ「設定」からバックアップを'),1500);
</script>
